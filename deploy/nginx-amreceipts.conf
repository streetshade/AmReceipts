# nginx reverse proxy for AmReceipts.
# Install:
#   sudo cp deploy/nginx-amreceipts.conf /etc/nginx/sites-available/amreceipts
#   sudo ln -s /etc/nginx/sites-available/amreceipts /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS is required: camera access (receipt capture and live barcode scanning) only
# works on HTTPS or localhost. Obtain a certificate with:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d receipts.example.com

server {
    listen 80;
    listen [::]:80;
    server_name receipts.example.com;

    # Redirect all HTTP to HTTPS (certbot manages the 443 block below).
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name receipts.example.com;

    # certbot fills these in; placeholders shown for reference.
    ssl_certificate     /etc/letsencrypt/live/receipts.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/receipts.example.com/privkey.pem;

    # Receipt image uploads: keep in step with MAX_BYTES (12MB) in the upload route.
    client_max_body_size 15M;

    # Serve uploaded receipt images and Next static assets efficiently.
    location /uploads/ {
        alias /opt/amreceipts/public/uploads/;
        expires 30d;
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # PDF receipts are user-uploaded ACTIVE content - a PDF can carry
    # JavaScript and fetch remote resources. nginx serves /uploads/ directly in
    # production, so the app's route handler never runs for these and its
    # headers do not apply: the same protection has to be repeated here or it
    # silently is not there at all.
    # Regex locations beat prefix ones in nginx, so this wins over /uploads/.
    # `alias` inside a regex location needs the captured remainder appended -
    # a bare directory alias here does not resolve.
    location ~ ^/uploads/(?<pdf_file>.+\.pdf)$ {
        alias /opt/amreceipts/public/uploads/$pdf_file;
        expires 30d;
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "attachment" always;
        add_header Content-Security-Policy "sandbox; default-src 'none'" always;
    }

    location /_next/static/ {
        alias /opt/amreceipts/.next/static/;
        expires 1y;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
